name: Publish site

on:
  push:
    branches: [main]
  workflow_call:      # called by the daily run after it commits new data
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main     # the latest commit, including today's data
      - name: Assemble the site
        run: |
          mkdir -p _site/data
          cp -r site/. _site/
          cp data/history.csv data/status.json _site/data/ || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
