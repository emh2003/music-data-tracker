name: Daily run

on:
  schedule:
    - cron: "23 13 * * *"   # 13:23 UTC every day (7:23 am Central)
  workflow_dispatch:         # "Run workflow" button for a manual run

concurrency:
  group: daily-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # commit the data files
      issues: write     # open today's issue, close yesterday's
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
      - name: Run the pipeline
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m tracker run
      - name: Commit raw files, history and status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Daily data $(date -u +%Y-%m-%d)" || echo "Nothing to commit"
          git pull --rebase
          git push

  publish:
    needs: run
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
